name: CI

# Prefer the latest commit on each branch/PR; obsolete test runs need not queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints-py312.txt
      - run: python -m pip install -c backend/constraints-py312.txt -e './backend[dev]'
      - run: python -m pip check
      - run: python backend/scripts/verify_python_constraints.py
      - name: Install English and Hindi OCR data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr
          tesseract --list-langs
      - run: python -m noticebridge.compare_cli --help
      - run: pytest -q backend/tests
      - run: ruff check backend
      - run: python backend/benchmarks/generate_showcase.py --check
  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c backend/constraints-py312.txt -e "./backend[dev]"
      - run: python -m pip check
      - run: python backend/scripts/verify_python_constraints.py
      - run: python -m noticebridge.compare_cli --help
      - run: python -m pytest -q backend/tests
      - run: python -m ruff check backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Test independent review workbench core
        run: |
          node --check tools/review-workbench/core.js
          node --check tools/review-workbench/ui.js
          node --test tools/review-workbench/core.test.cjs
      - run: npm run build
        working-directory: frontend

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -c backend/constraints-py312.txt -e './backend[dev]'
      - run: python -m pip check
      - run: python backend/scripts/verify_python_constraints.py
      - run: npm ci
        working-directory: frontend
      # Fail fast on invalid TypeScript test syntax and config before the
      # comparatively expensive browser and Linux dependency installation.
      - name: Validate browser test discovery
        run: npx playwright test --list
        working-directory: frontend
      - name: Validate offline showcase test discovery
        run: npx playwright test --config playwright.showcase.config.ts --list
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify workbench export with backend review tools
        run: python tools/review-workbench/test_interop.py --repo .
      - name: Test workbench browser workflow
        run: node tools/review-workbench/test_browser.cjs
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build:showcase
        working-directory: frontend
      - run: npm run test:showcase
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: noticebridge-static-showcase
          path: frontend/dist-showcase/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
